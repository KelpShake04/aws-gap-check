# 의존성 갱신 PR을 매주 만든다. 병합 전 CI가 돌고, 배포는 관리자 승인 뒤에만 나간다.
version: 2
updates:
  # requirements.txt는 해시 고정(--require-hashes)이라 Dependabot이 해시까지 같이 바꾼다
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  # 워크플로의 action(태그 고정 actions/*, SHA 고정 configure-aws-credentials)
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  # Dockerfile의 이미지 태그(prowler, python)
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  # compose.yaml의 이미지 태그(mysql, caddy). test.yml의 서비스 이미지 mysql:8.4.9는 어느 항목도 올리지 않으므로
  # compose.yaml의 mysql을 올릴 때 test.yml도 손으로 맞춘다
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # MySQL은 8.4 LTS 패치만 받는다. 9.x로 올리면 기존 데이터 볼륨을 되돌릴 수 없다
      - dependency-name: mysql
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
