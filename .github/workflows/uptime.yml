# 운영 사이트가 응답하는지 30분마다 확인한다. 실패하면 워크플로가 실패로 끝나고 GitHub이 메일로 알린다.
# 메일은 이 cron을 마지막으로 바꾼 사람(GitHub 계정)에게만 가고, 장애가 이어지면 30분마다 반복된다.
# 레포에 60일 동안 활동이 없으면 GitHub이 schedule을 끈다. public 레포라 Actions 비용은 없다.
# 사이트(EC2)를 일부러 꺼 둘 때는 Actions 화면에서 이 워크플로를 비활성화한다.
name: uptime

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site responds
        run: curl -fsS -o /dev/null -w "%{http_code}\n" --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 https://agc-kelp04.duckdns.org/
