name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 표준 라이브러리만 쓰므로 설치할 패키지가 없다
      - run: python -m unittest -v

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 템플릿 검증용 개발 도구. 런타임 의존성이 아니다
      - run: pip install cfn-lint==1.58.0
      - run: cfn-lint infra/*.yaml
