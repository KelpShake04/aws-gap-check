AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-gap-check app role for running the app on a local PC (no EC2). The app container gets
  1-hour credentials of this role and can only assume AwsGapCheckReadOnlyRole.

# 로컬 PC에서 앱을 돌려 실제 계정을 스캔할 때만 쓴다. 같은 계정의 관리자가 이 Role을 맡아
# 임시 자격 증명을 앱 컨테이너에 넣는다(scripts/local_aws_creds.sh). 관리자 키는 컨테이너에 넣지 않는다.
# EC2 배포 템플릿도 같은 Role 이름을 쓰므로, EC2로 옮기기 전에 이 스택을 지운다.

Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-gap-check-app-role
      Description: aws-gap-check app (local run) - assume customer read-only role only
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # 이 계정에서 sts:AssumeRole 권한이 있는 IAM 주체(관리자)만 맡을 수 있다
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: assume-customer-readonly-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/AwsGapCheckReadOnlyRole"

Outputs:
  RoleArn:
    Value: !GetAtt AppRole.Arn
