AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  aws-gap-check service stack: static web (S3 + CloudFront), Cognito login, HTTP API + Lambda,
  DynamoDB, Prowler CodeBuild scanner, EventBridge result processing with Gemini explanations.

# 서비스 계정에 배포한다. scripts/deploy.sh가 패키징과 파라미터를 채운다.
# 고정 이름: aws-gap-check-scanner-role, aws-gap-check-api-role(고객 Role 신뢰 정책이 지정),
# aws-gap-check-processor-role, CodeBuild 프로젝트 aws-gap-check-scanner.

Parameters:
  ArtifactBucket:
    Type: String
    Description: deploy.sh가 만든 배포 아티팩트 버킷
  ScannerSourceKey:
    Type: String
    AllowedPattern: "^scanner/scanner-[0-9a-f]{16}\\.zip$"
    Description: scanner/ zip의 S3 키 (내용 해시가 들어가 내용이 바뀔 때마다 새 키)
  ProwlerImage:
    Type: String
    Default: public.ecr.aws/prowler-cloud/prowler:5.46.0
    Description: Prowler 공식 이미지 (버전 고정). ECR Public에서 못 받으면 prowlercloud/prowler:5.46.0
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9-]{3,63}$"
    Description: Hosted UI 도메인 접두사 (aws, amazon, cognito 단어는 쓸 수 없음)
  GeminiModel:
    Type: String
    Default: ""
    Description: T0.2에서 확인한 Flash 모델 이름. 비어 있으면 AI 해설 없이 Prowler 원문만 보여 준다
  GeminiMaxRpm:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
    Description: 분당 Gemini 호출 상한 (무료 등급 한도에 맞춘다)
  DailyScanLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    CodeUri: ../backend/
    MemorySize: 256
    Timeout: 15

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # 버전 관리를 켜지 않는다. 결과 삭제가 실제 삭제가 되도록.
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-results
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub "${ResultsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/aws-gap-check-scanner
      RetentionInDays: 14

  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      # 고객 Role 신뢰 정책이 이 이름을 aws:PrincipalArn으로 지정한다. 바꾸면 템플릿도 같이 바꾼다.
      RoleName: aws-gap-check-scanner-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            # 서비스 간 confused deputy 방지: 이 계정의 CodeBuild만
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: scanner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ScannerLogGroup.Arn
              - Sid: ReadScannerSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ScannerSourceKey}"
              - Sid: ReadScannerSourceBucketInfo
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}"
              - Sid: WriteRawResults
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ResultsBucket.Arn}/raw/*"
              - Sid: AssumeCustomerReadOnlyRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/AwsGapCheckReadOnlyRole"

  ScannerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: aws-gap-check-scanner
      Description: Runs Prowler core checks against a connected account (read-only role)
      ServiceRole: !GetAtt ScannerRole.Arn
      Source:
        Type: S3
        Location: !Sub "${ArtifactBucket}/${ScannerSourceKey}"
        BuildSpec: buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref ProwlerImage
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: RESULTS_BUCKET
            Value: !Ref ResultsBucket
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 60
      # 비용 상한 겸 신규 계정 한도 대비. 동시에 한 스캔만 돈다.
      ConcurrentBuildLimit: 1
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ScannerLogGroup

  # ---------- 데이터 ----------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # 스캔과 결과는 30일 뒤 자동 삭제 (S3 수명주기와 같은 기간)
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------- 웹 (S3 + CloudFront, 버킷은 비공개) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          # 인라인 스크립트 금지. API 도메인은 스택 순환 참조를 피하려고 리전 와일드카드로 둔다
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: aws-gap-check web
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS 관리형 CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowThisDistributionOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- 로그인 (관리자만 사용자 생성) ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: aws-gap-check-users
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: aws-gap-check-web
      # 브라우저용 공개 클라이언트. 시크릿 대신 PKCE를 쓴다
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub "https://${Distribution.DomainName}/"
      LogoutURLs:
        - !Sub "https://${Distribution.DomainName}/"
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${Distribution.DomainName}"
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws-gap-check/api
      RetentionInDays: 14

  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws-gap-check/scan-finished
      RetentionInDays: 14

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      # 고객 Role 신뢰 정책이 이 이름을 aws:PrincipalArn으로 지정한다
      RoleName: aws-gap-check-api-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogGroup.Arn
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                         dynamodb:Query, dynamodb:BatchWriteItem]
                Resource: !GetAtt Table.Arn
              - Sid: StartScan
                Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt ScannerProject.Arn
              - Sid: VerifyConnection
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/AwsGapCheckReadOnlyRole"
              - Sid: ListRawResults
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResultsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: raw/*
              - Sid: DeleteRawResults
                Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub "${ResultsBucket.Arn}/raw/*"

  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-gap-check-processor-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: processor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ProcessorLogGroup.Arn
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query,
                         dynamodb:BatchWriteItem]
                Resource: !GetAtt Table.Arn
              - Sid: ReadBuild
                Effect: Allow
                Action: codebuild:BatchGetBuilds
                Resource: !GetAtt ScannerProject.Arn
              - Sid: ReadRawResults
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ResultsBucket.Arn}/raw/*"
              # Gemini 키는 이 역할만 읽는다 (AWS 관리형 키 aws/ssm으로 복호화)
              - Sid: ReadGeminiKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/aws-gap-check/gemini-api-key"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.api.handler
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PROJECT_NAME: !Ref ScannerProject
          RESULTS_BUCKET: !Ref ResultsBucket
          SERVICE_ACCOUNT_ID: !Ref AWS::AccountId
          DAILY_SCAN_LIMIT: !Ref DailyScanLimit
      Events:
        CreateConnection:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /connections}
        ListConnections:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /connections}
        VerifyConnection:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/connections/{id}/verify"}
        DeleteConnection:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: DELETE, Path: "/connections/{id}"}
        StartScan:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /scans}
        ListScans:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /scans}
        GetScan:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: "/scans/{id}"}
        DeleteScan:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: DELETE, Path: "/scans/{id}"}

  ScanFinishedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.scan_finished.handler
      Role: !GetAtt ProcessorRole.Arn
      Timeout: 600
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref ProcessorLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          RESULTS_BUCKET: !Ref ResultsBucket
          GEMINI_PARAM: /aws-gap-check/gemini-api-key
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_MAX_RPM: !Ref GeminiMaxRpm
      Events:
        BuildStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.codebuild]
              detail-type: [CodeBuild Build State Change]
              detail:
                project-name: [!Ref ScannerProject]
                build-status: [IN_PROGRESS, SUCCEEDED, FAILED, FAULT, STOPPED, TIMED_OUT]

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}/"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ResultsBucketName:
    Value: !Ref ResultsBucket
  ScannerProjectName:
    Value: !Ref ScannerProject
